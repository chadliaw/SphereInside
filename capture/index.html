<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SphereInside 拍攝</title>
<style>
  :root { color-scheme: dark; --bg: #111418; --panel: #1c2128; --text: #e8eaed; --muted: #9aa3ad; --accent: #4cc38a; --warn: #e5734f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 8px 0; color: var(--muted); }
  video { width: 100%; max-height: 55vh; background: #000; border-radius: 8px; display: block; object-fit: contain; }
  canvas#map { width: 100%; aspect-ratio: 2 / 1; background: var(--panel); border-radius: 8px; display: block; margin-top: 12px; }
  .readout { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; font-variant-numeric: tabular-nums; }
  .readout b { color: var(--text); font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  button { font: inherit; padding: 12px 18px; border: 0; border-radius: 8px; background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); color: #06281a; font-weight: 600; flex: 1; }
  button:disabled { opacity: .45; }
  label { color: var(--muted); }
  input { font: inherit; width: 5em; padding: 8px; border: 1px solid #39424d; border-radius: 6px; background: var(--panel); color: var(--text); }
  #message { color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>SphereInside 拍攝</h1>

  <section id="intro">
    <p>站在定點，讓手機繞著鏡頭轉動，朝四面八方各拍一張，直到下方的地圖全部變成綠色。相鄰的照片要互相重疊，正上方與正下方也要拍。</p>
    <div class="row">
      <label for="fov">鏡頭長邊視角（度）</label>
      <input id="fov" type="number" min="20" max="150" step="0.5" value="65">
    </div>
    <div class="row"><button id="start" class="primary">開始</button></div>
  </section>

  <section id="shoot" hidden>
    <video id="video" playsinline muted></video>
    <div class="readout">
      <span>方位 <b id="az">–</b></span>
      <span>仰角 <b id="el">–</b></span>
      <span>傾斜 <b id="roll">–</b></span>
      <span>已拍 <b id="count">0</b> 張</span>
      <span>已涵蓋 <b id="cover">0%</b></span>
    </div>
    <div class="row">
      <button id="shutter" class="primary">拍照</button>
      <button id="undo" disabled>刪除上一張</button>
    </div>
    <canvas id="map" width="720" height="360"></canvas>
    <p>地圖橫軸是方位、縱軸是仰角；紅色是還沒拍到的方向，十字是鏡頭現在對準的位置。</p>
    <div class="row"><button id="download" disabled>下載照片與對照檔（ZIP）</button></div>
  </section>

  <p id="message"></p>
</main>

<script>
"use strict";

// ---- 方向 ----------------------------------------------------------------
// 世界座標與 Python 端相同：+x 朝方位 0°，+y 朝方位 270°，+z 朝正上方。

const RAD = Math.PI / 180;
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

// 裝置座標（x 朝螢幕右方、y 朝螢幕上方、z 朝使用者）→ 世界座標。
// alpha、beta、gamma 是 deviceorientation 事件的三個角度。
function deviceToWorld(alpha, beta, gamma) {
  const cA = Math.cos(alpha * RAD), sA = Math.sin(alpha * RAD);
  const cB = Math.cos(beta * RAD), sB = Math.sin(beta * RAD);
  const cG = Math.cos(gamma * RAD), sG = Math.sin(gamma * RAD);
  // 規格定義的矩陣，結果是（東、北、上）
  const m = [
    [cA * cG - sA * sB * sG, -cB * sA, cG * sA * sB + cA * sG],
    [cG * sA + cA * sB * sG, cA * cB, sA * sG - cA * cG * sB],
    [-cB * sG, sB, cB * cG],
  ];
  return (v) => {
    const e = dot(m[0], v), n = dot(m[1], v), u = dot(m[2], v);
    return [n, -e, u];
  };
}

// 鏡頭的前、右、上（與 sphereinside/camera.py 的 basis 相同）
function basis(azimuth, elevation, roll) {
  const th = -azimuth * RAD, e = elevation * RAD, ro = roll * RAD;
  const fwd = [Math.cos(e) * Math.cos(th), Math.cos(e) * Math.sin(th), Math.sin(e)];
  const right0 = [Math.sin(th), -Math.cos(th), 0];
  const up0 = cross(right0, fwd);
  const c = Math.cos(ro), s = Math.sin(ro);
  return {
    fwd,
    right: right0.map((x, i) => c * x + s * up0[i]),
    up: right0.map((x, i) => -s * x + c * up0[i]),
  };
}

// 由裝置的姿態求後鏡頭的方位、仰角與傾斜。screenAngle 是 screen.orientation.angle。
function pose(alpha, beta, gamma, screenAngle) {
  const toWorld = deviceToWorld(alpha, beta, gamma);
  const fwd = toWorld([0, 0, -1]);
  const a = screenAngle * RAD;
  const right = toWorld([Math.cos(a), -Math.sin(a), 0]);
  const azimuth = ((Math.atan2(-fwd[1], fwd[0]) / RAD) % 360 + 360) % 360;
  const elevation = Math.asin(Math.max(-1, Math.min(1, fwd[2]))) / RAD;
  const ref = basis(azimuth, elevation, 0);
  const roll = Math.atan2(dot(right, ref.up), dot(right, ref.right)) / RAD;
  return { azimuth, elevation, roll };
}

// 沿影像寬度方向的視角
function horizontalFov(longFov, width, height) {
  const focal = Math.max(width, height) / 2 / Math.tan(longFov * RAD / 2);
  return 2 * Math.atan(width / 2 / focal) / RAD;
}

// ---- 涵蓋範圍 --------------------------------------------------------------

function fibonacciSphere(n) {
  const points = [];
  for (let i = 0; i < n; i++) {
    const z = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - z * z), t = Math.PI * (1 + Math.sqrt(5)) * (i + 0.5);
    points.push([r * Math.cos(t), r * Math.sin(t), z]);
  }
  return points;
}

function covers(shot, d) {
  const b = shot.basis, c = dot(d, b.fwd);
  if (c <= 1e-9) return false;
  const focal = shot.width / 2 / Math.tan(shot.hfov * RAD / 2);
  return Math.abs(focal * dot(d, b.right) / c) <= shot.width / 2 && Math.abs(focal * dot(d, b.up) / c) <= shot.height / 2;
}

function coverage(shots, points) {
  return points.map((d) => shots.some((s) => covers(s, d)));
}

// ---- ZIP（只儲存、不壓縮） ---------------------------------------------------

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// files: [{ name, data: Uint8Array }] → Blob
function makeZip(files) {
  const encoder = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const file of files) {
    const name = encoder.encode(file.name), crc = crc32(file.data), size = file.data.length;
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint16(10, 0, true);
    local.setUint16(12, 0x21, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, size, true);
    local.setUint32(22, size, true);
    local.setUint16(26, name.length, true);
    parts.push(local.buffer, name, file.data);

    const entry = new DataView(new ArrayBuffer(46));
    entry.setUint32(0, 0x02014b50, true);
    entry.setUint16(4, 20, true);
    entry.setUint16(6, 20, true);
    entry.setUint16(8, 0x0800, true);
    entry.setUint16(14, 0x21, true);
    entry.setUint32(16, crc, true);
    entry.setUint32(20, size, true);
    entry.setUint32(24, size, true);
    entry.setUint16(28, name.length, true);
    entry.setUint32(42, offset, true);
    central.push(entry.buffer, name);
    offset += 30 + name.length + size;
  }
  const centralSize = central.reduce((n, p) => n + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
}

// ---- 介面 ------------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const POINTS = fibonacciSphere(3000);
const shots = [];  // { name, blob, azimuth, elevation, roll, hfov, width, height, basis }
let orientation = null, covered = POINTS.map(() => false);

function currentPose() {
  if (!orientation) return null;
  const angle = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
  return pose(orientation.alpha, orientation.beta, orientation.gamma, angle);
}

function say(text) { $("message").textContent = text; }

function drawMap(now) {
  const canvas = $("map"), g = canvas.getContext("2d"), w = canvas.width, h = canvas.height;
  g.clearRect(0, 0, w, h);
  POINTS.forEach((d, i) => {
    const az = ((Math.atan2(-d[1], d[0]) / RAD) + 360) % 360, el = Math.asin(d[2]) / RAD;
    g.fillStyle = covered[i] ? "#4cc38a" : "#b5452f";
    g.fillRect(az / 360 * w - 2, (90 - el) / 180 * h - 2, 4, 4);
  });
  if (now) {
    const x = now.azimuth / 360 * w, y = (90 - now.elevation) / 180 * h;
    g.strokeStyle = "#fff";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x - 10, y); g.lineTo(x + 10, y);
    g.moveTo(x, y - 10); g.lineTo(x, y + 10);
    g.stroke();
  }
}

function refresh() {
  covered = coverage(shots, POINTS);
  $("count").textContent = shots.length;
  $("cover").textContent = Math.floor(covered.filter(Boolean).length / POINTS.length * 100) + "%";
  $("undo").disabled = $("download").disabled = shots.length === 0;
}

function tick() {
  const now = currentPose();
  if (now) {
    $("az").textContent = now.azimuth.toFixed(0) + "°";
    $("el").textContent = now.elevation.toFixed(0) + "°";
    $("roll").textContent = now.roll.toFixed(0) + "°";
  }
  drawMap(now);
  setTimeout(tick, 100);
}

async function start() {
  say("");
  try {
    if (typeof DeviceOrientationEvent === "undefined") throw new Error("這個瀏覽器不提供方向感測器。");
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      if (await DeviceOrientationEvent.requestPermission() !== "granted") throw new Error("需要允許使用動作與方向感測器。");
    }
    window.addEventListener("deviceorientation", (e) => {
      if (e.alpha !== null && e.beta !== null && e.gamma !== null) orientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
    });
    if (!navigator.mediaDevices) throw new Error("無法使用相機；這個網頁必須透過 HTTPS 開啟。");
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } },
    });
    $("video").srcObject = stream;
    await $("video").play();
  } catch (error) {
    say(error.message || String(error));
    return;
  }
  $("intro").hidden = true;
  $("shoot").hidden = false;
  refresh();
  tick();
}

function shoot() {
  const now = currentPose(), video = $("video");
  if (!now) return say("還沒有收到方向感測器的讀數；這台裝置可能沒有方向感測器。");
  if (!video.videoWidth) return say("相機還沒準備好。");
  say("");
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  const hfov = horizontalFov(Number($("fov").value) || 65, canvas.width, canvas.height);
  canvas.toBlob((blob) => {
    shots.push({
      blob, hfov, width: canvas.width, height: canvas.height,
      azimuth: now.azimuth, elevation: now.elevation, roll: now.roll,
      basis: basis(now.azimuth, now.elevation, now.roll),
    });
    refresh();
  }, "image/jpeg", 0.92);
}

async function download() {
  const round = (x) => Math.round(x * 100) / 100;
  const files = [], photos = [];
  for (let i = 0; i < shots.length; i++) {
    const s = shots[i], name = String(i + 1).padStart(3, "0") + ".jpg";
    files.push({ name, data: new Uint8Array(await s.blob.arrayBuffer()) });
    photos.push({ file: name, azimuth: round(s.azimuth), elevation: round(s.elevation), roll: round(s.roll), hfov: round(s.hfov) });
  }
  files.push({ name: "meta.json", data: new TextEncoder().encode(JSON.stringify({ photos }, null, 2)) });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(makeZip(files));
  link.download = "sphereinside-photos.zip";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 60000);
}

$("start").addEventListener("click", start);
$("shutter").addEventListener("click", shoot);
$("undo").addEventListener("click", () => { shots.pop(); refresh(); });
$("download").addEventListener("click", download);
</script>
</body>
</html>
