<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SphereInside</title>
<style>
  :root { color-scheme: dark; --bg: #111418; --panel: #1c2128; --text: #e8eaed; --muted: #9aa3ad; --accent: #4cc38a; --warn: #e5734f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 28px 0 8px; padding-top: 20px; border-top: 1px solid #2b323b; }
  h3 { font-size: 16px; margin: 16px 0 4px; }
  p { margin: 8px 0; color: var(--muted); }
  video { width: 100%; max-height: 55vh; background: #000; border-radius: 8px; display: block; object-fit: contain; }
  canvas#map { width: 100%; aspect-ratio: 2 / 1; background: var(--panel); border-radius: 8px; display: block; margin-top: 12px; }
  .readout { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; font-variant-numeric: tabular-nums; }
  .readout b { color: var(--text); font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  button { font: inherit; padding: 12px 18px; border: 0; border-radius: 8px; background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); color: #06281a; font-weight: 600; flex: 1; }
  button:disabled { opacity: .45; }
  label { color: var(--muted); }
  input, select { font: inherit; padding: 8px; border: 1px solid #39424d; border-radius: 6px; background: var(--panel); color: var(--text); }
  input { width: 5em; }
  input[type=file] { width: 100%; }
  input[type=checkbox] { width: auto; margin-right: 6px; }
  #message { color: var(--warn); }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; margin: 12px 0; }
  .grid input, .grid select { width: 100%; }
  a.button { padding: 12px 18px; border-radius: 8px; background: var(--panel); color: var(--accent); text-decoration: none; font-weight: 600; }
  pre { margin: 12px 0; padding: 12px; background: var(--panel); border-radius: 8px; color: var(--muted); font: 13px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }

  #align { position: fixed; inset: 0; z-index: 10; overflow: auto; background: var(--bg); }
  #align .viewer { position: relative; height: 62vh; min-height: 280px; background: #000; }
  #align .viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { touch-action: none; cursor: grab; }
  #align .controls { max-width: 900px; margin: 0 auto; padding: 4px 16px 24px; }
  #align .row { margin: 8px 0; }
  #align button { padding: 10px 14px; }
  #align button[aria-pressed="true"] { background: var(--accent); color: #06281a; }
  #photoInfo, #alignStatus { color: var(--text); }
  .fields { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0; }
  .fields label { display: flex; align-items: center; gap: 6px; }
  .fields input { width: 6.5em; font-variant-numeric: tabular-nums; }
  .cards { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 8px; }
  .card { flex: 0 0 auto; width: 120px; background: var(--panel); border-radius: 8px; padding: 6px; border: 2px solid transparent; }
  .card.current { border-color: #f2c94c; }
  .card img { width: 100%; height: 120px; object-fit: contain; background: #000; border-radius: 4px; display: block; cursor: pointer; }
  .card .name { font-size: 13px; color: var(--text); margin-top: 4px; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .meta.used { color: var(--accent); }
  .card button { width: 100%; margin-top: 4px; padding: 6px; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title">SphereInside 拍攝</h1>
    <select id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select>
  </div>

  <section id="intro">
    <p data-i18n="intro.text"></p>
    <div class="row">
      <label for="fov" data-i18n="intro.fov"></label>
      <input id="fov" type="number" min="20" max="150" step="0.5" value="65">
    </div>
    <div class="row"><button id="start" class="primary" data-i18n="intro.start"></button></div>
    <p data-i18n="intro.zip"></p>
    <div class="row"><input id="zip" type="file" accept=".zip,application/zip"></div>
    <p id="loaded"></p>
  </section>

  <section id="shoot" hidden>
    <video id="video" playsinline muted></video>
    <div class="readout">
      <span><span data-i18n="shoot.azimuth"></span> <b id="az">–</b></span>
      <span><span data-i18n="shoot.elevation"></span> <b id="el">–</b></span>
      <span><span data-i18n="shoot.roll"></span> <b id="roll">–</b></span>
      <span><span data-i18n="shoot.count"></span> <b id="count">0</b></span>
      <span><span data-i18n="shoot.cover"></span> <b id="cover">0%</b></span>
    </div>
    <div class="row">
      <button id="shutter" class="primary" data-i18n="shoot.shutter"></button>
      <button id="undo" disabled data-i18n="shoot.undo"></button>
    </div>
    <canvas id="map" width="720" height="360"></canvas>
    <p data-i18n="shoot.map"></p>
    <div class="row"><button id="download" disabled data-i18n="shoot.download"></button></div>
  </section>

  <p id="message"></p>

  <section id="build">
    <h2 data-i18n="build.title"></h2>
    <p data-i18n="build.note"></p>
    <div class="grid">
      <label for="level" data-i18n="build.level"></label>
      <select id="level">
        <option value="0" data-i18n="build.faces" data-i18n-params='{"n":20}'></option>
        <option value="1" selected data-i18n="build.faces" data-i18n-params='{"n":60}'></option>
        <option value="2" data-i18n="build.faces" data-i18n-params='{"n":180}'></option>
      </select>
      <label for="diameter" data-i18n="build.diameter"></label>
      <input id="diameter" type="number" min="40" max="600" step="5" value="150">
      <label for="paper" data-i18n="build.paper"></label>
      <select id="paper"><option>A4</option><option>A3</option><option>Letter</option></select>
      <label for="dpi" data-i18n="build.dpi"></label>
      <select id="dpi">
        <option value="200" selected data-i18n="build.dpi200"></option>
        <option value="300" data-i18n="build.dpi300"></option>
      </select>
      <label for="labels" data-i18n="build.labels"></label>
      <select id="labels">
        <option value="inside" data-i18n="build.labelsInside"></option>
        <option value="outside" selected data-i18n="build.labelsOutside"></option>
        <option value="none" data-i18n="build.labelsNone"></option>
      </select>
    </div>
    <div class="row"><label><input id="gaps" type="checkbox"><span data-i18n="build.gaps"></span></label></div>
    <p data-i18n="build.alignNote"></p>
    <div class="row">
      <button id="openAlign" disabled data-i18n="build.align"></button>
      <button id="openCompose" disabled data-i18n="build.compose"></button>
    </div>
    <div class="row">
      <button id="make" class="primary" disabled data-i18n="build.make"></button>
      <a id="result" class="button" hidden download="sphereinside.pdf" data-i18n="build.result"></a>
    </div>
    <pre id="log" hidden></pre>
  </section>
</main>

<section id="align" hidden>
  <div class="viewer">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
  </div>
  <div class="controls">
    <p id="alignStatus"></p>
    <div class="row">
      <button id="modeView" aria-pressed="true" data-i18n="align.modeView"></button>
      <button id="modeAdjust" aria-pressed="false" data-i18n="align.modeAdjust"></button>
      <button id="modeCrop" aria-pressed="false" data-i18n="align.modeCrop"></button>
      <label><input id="translucent" type="checkbox"><span data-i18n="align.translucent"></span></label>
      <label><input id="showMesh" type="checkbox" checked><span data-i18n="align.showMesh"></span></label>
    </div>
    <div class="row">
      <button id="prevVertex" data-i18n="align.prevVertex"></button>
      <span id="vertexInfo"></span>
      <button id="nextVertex" data-i18n="align.nextVertex"></button>
    </div>

    <p id="photoInfo"></p>
    <div class="fields" id="photoFields" hidden>
      <label><span data-i18n="align.azimuth"></span> <input data-field="azimuth" type="number" step="0.1"> °</label>
      <label><span data-i18n="align.elevation"></span> <input data-field="elevation" type="number" step="0.1" min="-90" max="90"> °</label>
      <label><span data-i18n="align.roll"></span> <input data-field="roll" type="number" step="0.1"> °</label>
      <label><span data-i18n="align.hfov"></span> <input data-field="hfov" type="number" step="0.1" min="1" max="170"> °</label>
      <label><span data-i18n="align.priority"></span> <input data-field="priority" type="number" step="1"></label>
    </div>
    <div class="fields" id="cropFields" hidden>
      <span data-i18n="align.crop"></span>
      <label><span data-i18n="align.cropLeft"></span> <input data-crop="0" type="number" step="1" min="0" max="100"></label>
      <label><span data-i18n="align.cropTop"></span> <input data-crop="1" type="number" step="1" min="0" max="100"></label>
      <label><span data-i18n="align.cropRight"></span> <input data-crop="2" type="number" step="1" min="0" max="100"></label>
      <label><span data-i18n="align.cropBottom"></span> <input data-crop="3" type="number" step="1" min="0" max="100"></label>
      <button id="cropReset" data-i18n="align.cropReset"></button>
    </div>
    <div class="row" id="orderRow" hidden>
      <button id="useToggle"></button>
      <button id="toFront" data-i18n="align.toFront"></button>
      <button id="toBack" data-i18n="align.toBack"></button>
      <button id="autoOrder" data-i18n="align.autoOrder"></button>
    </div>
    <div class="row">
      <label><span data-i18n="align.step"></span> <input id="step" type="number" value="0.2" min="0.01" step="0.1"> °</label>
      <button data-nudge="-1,0" data-i18n-title="align.left">←</button>
      <button data-nudge="1,0" data-i18n-title="align.right">→</button>
      <button data-nudge="0,1" data-i18n-title="align.up">↑</button>
      <button data-nudge="0,-1" data-i18n-title="align.down">↓</button>
      <button data-roll="-1" data-i18n-title="align.ccw">⟲</button>
      <button data-roll="1" data-i18n-title="align.cw">⟳</button>
      <button data-zoom="-1" data-i18n-title="align.narrower">－</button>
      <button data-zoom="1" data-i18n-title="align.wider">＋</button>
      <label><input id="allFov" type="checkbox" checked><span data-i18n="align.allFov"></span></label>
    </div>

    <h3 data-i18n="align.candidates"></h3>
    <p data-i18n="align.candidatesHint"></p>
    <div class="cards" id="cards"></div>
    <div class="row">
      <button id="useNone" data-i18n="align.useNone"></button>
      <button id="useAll" data-i18n="align.useAll"></button>
    </div>

    <div class="row">
      <button id="alignUndo" data-i18n="align.undo"></button>
      <button id="alignReset" data-i18n="align.reset"></button>
      <button id="alignDownload" data-i18n="align.download"></button>
      <button id="alignDone" class="primary" data-i18n="align.done"></button>
    </div>
    <p data-i18n="align.helpView"></p>
    <p data-i18n="align.helpOrder"></p>
  </div>
</section>

<script src="i18n.js"></script>
<script src="align.js"></script>
<script src="app.js"></script>
</body>
</html>
